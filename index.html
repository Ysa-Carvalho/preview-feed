<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>Prévia do feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagina">
    <header class="topo"><span id="perfil-nome">perfil</span></header>

    <section class="perfil">
      <h1>Prévia do feed</h1>
      <p>Toque num post para ver a arte e a legenda e aprovar ou pedir ajuste.</p>
      <p class="progresso" id="progresso"></p>
    </section>

    <nav class="abas" aria-hidden="true">
      <span class="aba">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
        PUBLICAÇÕES
      </span>
    </nav>

    <main id="grade" class="grade"></main>
    <p id="estado" class="estado">Carregando as artes…</p>
  </div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-caixa">
      <header class="modal-topo">
        <button class="btn-icone" id="fechar" aria-label="Fechar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="modal-titulo">Post</h2>
        <span class="btn-icone" aria-hidden="true"></span>
      </header>

      <div class="midia" id="midia">
        <div class="trilho" id="trilho"></div>
        <button class="seta seta-esq" id="seta-esq" aria-label="Slide anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="seta seta-dir" id="seta-dir" aria-label="Próximo slide">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="contador" id="contador"></span>
        <div class="bolinhas" id="bolinhas"></div>
      </div>

      <div class="painel">
        <div class="legenda" id="legenda"></div>
        <div class="status-atual" id="status-atual" hidden></div>
        <div class="acoes">
          <button class="btn btn-aprovar" id="btn-aprovar">Aprovar</button>
          <button class="btn btn-ajuste" id="btn-ajuste">Pedir ajuste</button>
        </div>
        <form id="form-ajuste" class="form-ajuste" hidden>
          <label for="texto-ajuste">O que você gostaria de mudar?</label>
          <textarea id="texto-ajuste" rows="4" required
            placeholder="Ex.: trocar a cor do título, corrigir o preço no slide 2…"></textarea>
          <button type="submit" class="btn btn-aprovar" id="btn-enviar-ajuste">Enviar pedido de ajuste</button>
        </form>
      </div>
    </div>
  </div>

  <div id="aviso" class="aviso" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
